name: Migrate & Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: cd web && npm install --legacy-peer-deps

      - name: Run database migrations
        # Use the direct (non-pooled) Supabase URL so Prisma can open a
        # proper session connection. Port 5432, not 6543 (pgBouncer).
        run: cd web && npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

      - name: Deploy to Vercel (build only — no migrations)
        run: npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_vsoApPb9UKqtavE3XHgbKSRL
          VERCEL_PROJECT_ID: prj_5qIGWXN7aT2sR1Pipcc7oO5ggids
