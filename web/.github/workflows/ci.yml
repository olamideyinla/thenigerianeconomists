name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Stub values so Next.js config + Prisma client can be instantiated
      # without real credentials during CI. DB calls are never made.
      DATABASE_URL: "postgresql://ci:ci@localhost/ci"
      NEXT_PUBLIC_SITE_URL: "https://thenigerianeconomists.com"
      NEXTAUTH_SECRET: "ci-secret-not-real"
      AUTH_SECRET: "ci-secret-not-real"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        working-directory: web
        run: pnpm exec prisma generate

      - name: Validate Prisma schema
        working-directory: web
        run: pnpm exec prisma validate

      - name: ESLint
        working-directory: web
        run: pnpm exec next lint --max-warnings 0

      - name: TypeScript
        working-directory: web
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: web
        run: pnpm exec next build
        env:
          # Skip DB-backed routes at build time
          NEXT_SKIP_VALIDATE_ROUTES: "1"
