version: '3.8'

# Local dev services for The Nigerian Economists
# Run: docker compose up -d
# MeiliSearch UI: http://localhost:7700

services:
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: tne_meilisearch
    ports:
      - '7700:7700'
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_API_KEY:-masterKey}
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped

volumes:
  meili_data:
